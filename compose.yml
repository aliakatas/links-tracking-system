services:
  db:
    image: docker.io/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:?Required}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["${POSTGRES_DATA_DIR:-./.pgdata}:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies pending migrations, then exits. The API waits for it.
  migrate:
    build:
      context: .
      dockerfile: containers/Containerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: containers/Containerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    # Liveness only: /version doesn't touch the database, so a DB outage
    # doesn't mark the API container unhealthy. (Defined here rather than in
    # the Containerfile because Podman's default OCI image format drops it.)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      # Where nginx forwards /api/*. Point this at any reachable backend.
      API_URL: ${API_URL:-http://api:8000}
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
